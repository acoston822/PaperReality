name: UIKit runtime smoke

on:
  workflow_dispatch:

# Run only when debugging or renders are requested, not for routine IPA pushes.

permissions:
  contents: read

jobs:
  simulator:
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      # Check out only the native UI and generated-pixel test fixtures. The
      # harness does not build the game or load ROMs, saves, packs or resources.
      - uses: actions/checkout@v6
        with:
          submodules: false
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /src/port/ios/IosNativeSettings.mm
            /src/port/ui/NativeSettings.h
            /src/port/ui/NativePortrait.h
            /tests/native-settings/portraits.cpp
            /tests/uikit/

      - name: Check native UI and overscroll on iPhone Simulator
        run: |
          mkdir -p build-uikit-smoke
          if python3 tests/uikit/run.py --no-captures > build-uikit-smoke/runner.log 2>&1; then
            cat build-uikit-smoke/runner.log
          else
            cat build-uikit-smoke/runner.log
            python3 - <<'PYLOG'
          from pathlib import Path
          text = Path('build-uikit-smoke/runner.log').read_text()[-14000:]
          print('::error::' + text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))
          PYLOG
            exit 1
          fi

      # No screenshots, simulator apps, logs or other files are uploaded as
      # artifacts, committed to a branch, or published to a PR or GitHub Pages.
      - name: Remove simulator output
        if: always()
        run: rm -rf build-uikit-smoke
