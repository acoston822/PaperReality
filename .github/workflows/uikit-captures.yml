name: Retrieve asset-free UIKit captures
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful asset-free UIKit smoke run
        required: true
        default: '39271420042'
  push:
    branches: [experimental/uikit-settings]
    paths:
      - .github/workflows/uikit-captures.yml
permissions:
  contents: write
  actions: read
jobs:
  captures:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - name: Download asset-free test captures
        env:
          GH_TOKEN: ${{ github.token }}
          CAPTURE_RUN: ${{ inputs.run_id || '39271420042' }}
        run: |
          [[ "$CAPTURE_RUN" =~ ^[0-9]+$ ]]
          for attempt in $(seq 1 100); do
            capture_status=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${CAPTURE_RUN}" --jq '.status')
            if [[ "$capture_status" == completed ]]; then break; fi
            sleep 5
          done
          gh run download "$CAPTURE_RUN" --repo "$GITHUB_REPOSITORY" --name UIKit-runtime-smoke --dir build-uikit-capture
      - name: Make the asset-free captures available for review
        # Only the synthetic harness PNGs are copied. No game data is in this job.
        # A separate, parentless capture branch keeps images out of application code.
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          python3 - <<'PY'
          import os, subprocess
          from pathlib import Path
          entries = []
          for name in ['general.png', 'audio.png', 'sidebar.png']:
              path = Path('build-uikit-capture') / name
              blob = subprocess.check_output(['git', 'hash-object', '-w', str(path)], text=True).strip()
              entries.append(f'100644 blob {blob}\t{name}\n')
          tree = subprocess.check_output(['git', 'mktree'], input=''.join(entries), text=True).strip()
          commit = subprocess.check_output(['git', 'commit-tree', tree, '-m', 'Asset-free UIKit simulator captures using sample preferences'], text=True).strip()
          branch = 'ui-captures/uikit-' + os.environ['GITHUB_RUN_ID']
          subprocess.run(['git', 'push', 'origin', commit + ':refs/heads/' + branch], check=True)
          print('::notice::Asset-free UI captures: ' + branch)
          PY
