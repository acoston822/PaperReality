name: UIKit runtime smoke
on:
  workflow_dispatch:
  push:
    branches: [experimental/uikit-settings]
    paths:
      - src/port/ios/IosNativeSettings.mm
      - src/port/ui/NativeSettings.h
      - tests/uikit/**
      - .github/workflows/uikit-smoke.yml
permissions:
  contents: read
jobs:
  simulator:
    runs-on: macos-14
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - name: Open and reopen settings on iPhone Simulator
        run: |
          mkdir -p build-uikit-smoke
          if python3 tests/uikit/run.py > build-uikit-smoke/runner.log 2>&1; then
            cat build-uikit-smoke/runner.log
          else
            cat build-uikit-smoke/runner.log
            python3 - <<'PYLOG'
          from pathlib import Path
          text = Path('build-uikit-smoke/runner.log').read_text()[-14000:]
          print('::error::' + text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))
          PYLOG
            exit 1
          fi
      - name: Upload simulator result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: UIKit-runtime-smoke
          path: |
            build-uikit-smoke/*.json
            build-uikit-smoke/*.log
            build-uikit-smoke/*.png
