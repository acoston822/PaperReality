name: Retrieve asset-free UIKit captures
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful asset-free UIKit smoke run
        required: true
        default: 'latest'
  push:
    branches: [experimental/uikit-settings]
    paths:
      - .github/workflows/uikit-captures.yml
      - src/port/ios/IosNativeSettings.mm
      - tests/uikit/**
permissions:
  contents: write
  actions: read
jobs:
  captures:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - name: Download asset-free test captures
        env:
          GH_TOKEN: ${{ github.token }}
          CAPTURE_RUN: ${{ inputs.run_id || 'latest' }}
        run: |
          if [[ "$CAPTURE_RUN" == latest ]]; then
            CAPTURE_RUN=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/uikit-smoke.yml/runs?branch=experimental%2Fuikit-settings&per_page=1" --jq '.workflow_runs[0].id')
          fi
          [[ "$CAPTURE_RUN" =~ ^[0-9]+$ ]]
          for attempt in $(seq 1 100); do
            capture_status=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${CAPTURE_RUN}" --jq '.status')
            if [[ "$capture_status" == completed ]]; then break; fi
            sleep 5
          done
          gh run download "$CAPTURE_RUN" --repo "$GITHUB_REPOSITORY" --name UIKit-runtime-smoke --dir build-uikit-capture
          export CAPTURE_RUN
          python3 - <<'PY'
          import json, os, subprocess, time
          from pathlib import Path
          repo = os.environ['GITHUB_REPOSITORY']
          def api(path):
              return json.loads(subprocess.check_output(['gh', 'api', 'repos/' + repo + '/actions/' + path], text=True))
          smoke = api('runs/' + os.environ['CAPTURE_RUN'])
          runs = api('workflows/ios-unsigned.yml/runs?branch=experimental%2Fuikit-settings&per_page=15')
          ipa = next((r for r in runs['workflow_runs'] if r['head_sha'] == smoke['head_sha']), None)
          if ipa:
              for attempt in range(90):
                  ipa = api('runs/' + str(ipa['id']))
                  if ipa['status'] == 'completed': break
                  time.sleep(5)
          keys = ['html_url', 'head_sha', 'run_number', 'status', 'conclusion']
          report = {name: {k: run[k] for k in keys} if run else None for name, run in [('simulator', smoke), ('ios', ipa)]}
          Path('build-uikit-capture/verification.json').write_text(json.dumps(report, indent=2))
          PY
      - name: Make the asset-free captures available for review
        # Only the synthetic harness PNGs are copied. No game data is in this job.
        # A separate, parentless capture branch keeps images out of application code.
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          python3 - <<'PY'
          import os, subprocess
          from pathlib import Path
          entries = []
          for name in ['general.png', 'audio.png', 'sidebar.png', 'audio-dark.png', 'general-dark.png', 'result.json', 'verification.json']:
              path = Path('build-uikit-capture') / name
              blob = subprocess.check_output(['git', 'hash-object', '-w', str(path)], text=True).strip()
              entries.append(f'100644 blob {blob}\t{name}\n')
          tree = subprocess.check_output(['git', 'mktree'], input=''.join(entries), text=True).strip()
          commit = subprocess.check_output(['git', 'commit-tree', tree, '-m', 'Asset-free UIKit simulator captures using sample preferences'], text=True).strip()
          branch = 'ui-captures/uikit-' + os.environ['GITHUB_RUN_ID']
          subprocess.run(['git', 'push', 'origin', commit + ':refs/heads/' + branch], check=True)
          print('::notice::Asset-free UI captures: ' + branch)
          PY
