name: Build unsigned iOS IPA

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Publish a release with this version (for example 1.0.0). Leave empty for a normal build.'
        required: false
        default: ''
  push:
    branches-ignore: [develop]
    tags: ['v*']

permissions:
  contents: write

jobs:
  # Temporary repository-wide pause. Remove this job before re-enabling Build
  # and Release in Actions; their workflow definitions remain available.
  pause-other-builds:
    if: github.repository == 'acoston822/PaperReality'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Pause multi-platform builds and desktop releases
        uses: actions/github-script@v9
        with:
          script: |
            for (const workflow_id of ['build.yml', 'release.yml']) {
              const { data: workflow } = await github.rest.actions.getWorkflow({ ...context.repo, workflow_id });
              if (workflow.state === 'active') {
                await github.rest.actions.disableWorkflow({ ...context.repo, workflow_id });
                core.notice(`Paused ${workflow_id}; unsigned IPA and UIKit workflows remain enabled.`);
              } else {
                core.notice(`${workflow_id} is already paused (${workflow.state}).`);
              }
              const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
                ...context.repo,
                workflow_id,
                per_page: 100,
              });
              for (const run of runs) {
                if (run.status === 'completed') continue;
                try {
                  await github.rest.actions.cancelWorkflowRun({ ...context.repo, run_id: run.id });
                  core.notice(`Cancelled pending/running ${workflow_id} run ${run.run_number}.`);
                } catch (error) {
                  if (error.status !== 409) throw error;
                }
              }
            }

  cleanup-simulator-runs:
    if: github.ref == 'refs/heads/experimental/uikit-settings'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: write
    steps:
      - name: Remove completed simulator and capture runs
        uses: actions/github-script@v9
        with:
          script: |
            // The explicit request file starts the separate debug workflow on
            // this branch. Wait for its registration before normal cleanup.
            if (context.eventName === 'push' && context.payload.head_commit?.message.includes('[uikit-debug]')) {
              let started = false;
              for (let attempt = 0; attempt < 40; ++attempt) {
                const { data } = await github.rest.actions.listWorkflowRunsForRepo({
                  ...context.repo, head_sha: context.sha, per_page: 30,
                });
                if (data.workflow_runs.some(run => (run.path || '').split('@')[0] === '.github/workflows/uikit-smoke.yml')) {
                  started = true; break;
                }
                await new Promise(resolve => setTimeout(resolve, 1500));
              }
              if (!started) throw new Error('Requested UIKit debug run did not start; cleanup left it intact.');
              core.notice('Requested UIKit debug check registered.');
            }
            const simulatorPaths = new Set([
              '.github/workflows/uikit-smoke.yml',
              '.github/workflows/uikit-captures.yml',
            ]);
            const deadline = Date.now() + 15 * 60 * 1000;
            let simulatorRuns;
            for (;;) {
              const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
                ...context.repo,
                per_page: 100,
              });
              simulatorRuns = runs.filter(run =>
                simulatorPaths.has((run.path || '').split('@')[0])
              ).sort((a, b) => Date.parse(b.created_at) - Date.parse(a.created_at));
              if (simulatorRuns.every(run => run.status === 'completed')) break;
              if (Date.now() >= deadline) throw new Error('Simulator still active; cleanup left its run intact.');
              core.info('Waiting for simulator checks to finish before cleanup.');
              await new Promise(resolve => setTimeout(resolve, 15000));
            }
            const latest = simulatorRuns[0];
            if (latest) {
              core.notice(`Latest simulator/capture run ${latest.run_number}: ${latest.conclusion}.`);
            }
            let removed = 0;
            for (const run of simulatorRuns) {
              // Retain the newest unsuccessful result until it can be diagnosed.
              // After a successful rerun, all older results can be removed.
              if (run.id === latest.id && latest.conclusion !== 'success') {
                core.notice(`Retained unsuccessful simulator run ${run.run_number} for diagnosis.`);
                continue;
              }
              try {
                await github.rest.actions.deleteWorkflowRun({ ...context.repo, run_id: run.id });
                ++removed;
                core.info(`Removed completed simulator/capture run ${run.run_number}.`);
              } catch (error) {
                if (error.status !== 404) throw error;
              }
            }
            core.notice(`Removed ${removed} completed simulator/capture runs. IPA runs were left intact.`);

  ios:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Check UIKit sources
        run: |
          xcrun --sdk iphoneos clang++ -std=c++20 -fobjc-arc -fsyntax-only \
            -target arm64-apple-ios16.3 -D__IOS__ -Isrc \
            src/port/ios/IosNativeSettings.mm src/port/ios/IosFilePicker.mm tests/uikit/Host.mm

      - name: Install dependencies
        run: brew install cmake ninja

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: ios-ccache-${{ github.ref }}
          restore-keys: |
            ios-ccache-

      - name: Configure
        run: |
          cmake -S . -B build-ios -G Xcode \
            -DCMAKE_TOOLCHAIN_FILE=cmake/ios.paperboat.toolchain.cmake \
            -DPLATFORM=OS64 -DIOS_SIGNING=OFF

      - name: Build
        run: cmake --build build-ios --config Release --parallel $(sysctl -n hw.logicalcpu)

      - name: Package IPA
        run: |
          APP=$(find build-ios -name '*.app' -path '*Release-iphoneos*' -maxdepth 4 | head -1)
          echo "App bundle: $APP"
          test -n "$APP"
          # Always ship our own icon, whatever an upstream merge did to ios/Icon.png.
          cp ios/PaperReality-Icon.png "$APP/Icon.png"
          # Stamp the run number into the app so each build can be told apart:
          # it shows as the app's version/build and is printed at the top of Paperboat.log.
          PLIST="$APP/Info.plist"
          BASE=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$PLIST")
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ github.run_number }}" "$PLIST"
          REL="${{ github.event.inputs.release_version }}"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then REL="${GITHUB_REF_NAME#v}"; fi
          if [[ -n "$REL" ]]; then
            # Release builds show the release version (1.0.0).
            /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${REL}" "$PLIST"
          else
            /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${BASE}-b${{ github.run_number }}" "$PLIST"
          fi
          mkdir -p out/Payload
          cp -R "$APP" out/Payload/
          (cd out && zip -qry PaperReality-unsigned.ipa Payload)
          mv out/PaperReality-unsigned.ipa out/PaperReality-b${{ github.run_number }}-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v7
        with:
          name: PaperReality-unsigned-ipa-b${{ github.run_number }}
          path: out/PaperReality-b${{ github.run_number }}-unsigned.ipa

      - name: Create the release
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.release_version != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REL="${{ github.event.inputs.release_version }}"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then REL="${GITHUB_REF_NAME#v}"; fi
          TAG="v${REL}"
          cp out/PaperReality-b${{ github.run_number }}-unsigned.ipa "out/PaperReality-${TAG}-unsigned.ipa"
          NOTES="docs/release-notes/${TAG}.md"
          if [ -f "$NOTES" ]; then
            NOTEARGS=(--notes-file "$NOTES")
          else
            NOTEARGS=(--generate-notes)
          fi
          # Creates the tag on this commit if it doesn't exist yet.
          gh release create "$TAG" "out/PaperReality-${TAG}-unsigned.ipa" \
            --target "$GITHUB_SHA" --title "PaperReality ${REL}" "${NOTEARGS[@]}"
