name: Build unsigned iOS IPA

on:
  workflow_dispatch:
    inputs:
      ui_diagnostics:
        description: 'Development IPA with UIKit timing overlay (not for releases)'
        type: boolean
        required: false
        default: false
  push:
    branches: ['experimental/shadow-leaf-fixes-1.0.5', 'release/v1.0.6']

permissions:
  contents: read

jobs:

  ios:
    if: github.ref == 'refs/heads/experimental/shadow-leaf-fixes-1.0.5' || github.ref == 'refs/heads/release/v1.0.6'
    runs-on: ${{ github.ref == 'refs/heads/release/v1.0.6' && 'macos-15-intel' || 'macos-15' }}
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      RELEASE_VERSION: ${{ github.ref == 'refs/heads/release/v1.0.6' && '1.0.6' || '' }}
      UI_DIAGNOSTICS: ${{ (github.event_name == 'workflow_dispatch' && inputs.ui_diagnostics) || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/') && contains(github.event.head_commit.message, '[ui-diagnostics]')) }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Verify comparison toolchain
        run: |
          xcodebuild -version
          test "$(xcrun --sdk iphoneos --show-sdk-version)" = "18.5"

      - name: Select IPA variant
        run: |
          if [[ -n "$RELEASE_VERSION" ]]; then
            if [[ "$UI_DIAGNOSTICS" == true ]]; then
              echo "Release builds cannot enable UI diagnostics."
              exit 1
            fi
            echo 'IPA_FLAVOR=' >> "$GITHUB_ENV"
          elif [[ "$UI_DIAGNOSTICS" == true ]]; then
            echo 'IPA_FLAVOR=-development' >> "$GITHUB_ENV"
          else
            echo 'IPA_FLAVOR=-experimental-render-fixes' >> "$GITHUB_ENV"
          fi

      - name: Verify release source and stamp
        if: github.ref == 'refs/heads/release/v1.0.6'
        run: |
          python3 - <<'PYRELEASE'
          from pathlib import Path
          import os
          import re

          version = os.environ['RELEASE_VERSION']
          cmake = Path('CMakeLists.txt').read_text()
          assert re.search(r'project\(Paperboat\s+VERSION\s+' + re.escape(version) + r'\s', cmake), 'Project version mismatch'
          assert Path(f'docs/release-notes/v{version}.md').is_file(), 'Release notes missing'
          PYRELEASE
          TAG="v$RELEASE_VERSION"
          if git show-ref --verify --quiet "refs/tags/$TAG"; then
            test "$(git rev-parse "$TAG^{}")" = "$GITHUB_SHA"
          else
            # Local build stamp only. Publication creates the remote tag after checks pass.
            git tag "$TAG" "$GITHUB_SHA"
          fi

      - name: Check UIKit sources
        run: |
          for DIAGNOSTICS in 0 1; do
            if ! xcrun --sdk iphoneos clang++ -std=c++20 -fobjc-arc -fsyntax-only \
              -target arm64-apple-ios16.3 -D__IOS__ -DPAPERREALITY_UI_DIAGNOSTICS=$DIAGNOSTICS -Isrc -Iexternal/libultraship/include \
              src/port/ios/IosNativeSettings.mm src/port/ios/IosControllerNavigation.mm src/port/ios/IosFilePicker.mm src/port/ios/IosExternalDisplay.mm tests/uikit/Host.mm > "$RUNNER_TEMP/uikit-syntax.log" 2>&1; then
              python3 - "$RUNNER_TEMP/uikit-syntax.log" <<'PYERROR'
          from pathlib import Path
          import sys
          log = Path(sys.argv[1]).read_text()
          print(log)
          print('::error::' + log[-14000:].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))
          PYERROR
              exit 1
            fi
            cat "$RUNNER_TEMP/uikit-syntax.log"
          done
          c++ -std=c++20 -Isrc tests/native-settings/frame-timing.cpp -o "$RUNNER_TEMP/ui-timing-check"
          "$RUNNER_TEMP/ui-timing-check"
          c++ -std=c++20 -Iexternal/libultraship/include tests/native-settings/frame-pacer.cpp -o "$RUNNER_TEMP/frame-pacer-check"
          "$RUNNER_TEMP/frame-pacer-check"
          c++ -std=c++20 -Wall -Wextra -Werror -Isrc -Iexternal/libultraship/include tests/native-settings/display-timing.cpp -o "$RUNNER_TEMP/display-timing-check"
          "$RUNNER_TEMP/display-timing-check"
          c++ -std=c++20 -Wall -Wextra -Werror -Isrc tests/native-settings/model-portraits.cpp -o "$RUNNER_TEMP/model-portrait-check"
          "$RUNNER_TEMP/model-portrait-check"
          c++ -std=c++20 -Wall -Wextra -Werror -Isrc tests/native-settings/controller-navigation.cpp -o "$RUNNER_TEMP/controller-navigation-check"
          "$RUNNER_TEMP/controller-navigation-check"

      - name: Check startup aspect handling
        run: python3 tests/rendering/run-boot-aspect.py

      - name: Check HD upgrade-orb coverage
        run: python3 tests/rendering/run-upgrade-orb-alpha.py

      - name: Install dependencies
        run: brew install cmake ninja

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: ios-ccache-${{ github.ref }}
          restore-keys: |
            ios-ccache-

      - name: Configure
        run: |
          cmake -S . -B build-ios -G Xcode \
            -DCMAKE_TOOLCHAIN_FILE=cmake/ios.paperboat.toolchain.cmake \
            -DPLATFORM=OS64 -DIOS_SIGNING=OFF -DPAPERREALITY_UI_DIAGNOSTICS="$UI_DIAGNOSTICS" \
            -DCMAKE_FIND_ROOT_PATH_MODE_PACKAGE=ONLY \
            -DCMAKE_FIND_ROOT_PATH_MODE_LIBRARY=ONLY \
            -DCMAKE_FIND_ROOT_PATH_MODE_INCLUDE=ONLY

      - name: Build
        run: cmake --build build-ios --config Release --parallel $(sysctl -n hw.logicalcpu)

      - name: Package IPA
        run: |
          APP=$(find build-ios -name '*.app' -path '*Release-iphoneos*' -maxdepth 4 | head -1)
          echo "App bundle: $APP"
          test -n "$APP"
          # Always ship our own icon, whatever an upstream merge did to ios/Icon.png.
          cp ios/PaperReality-Icon.png "$APP/Icon.png"
          # Stamp the run number into the app so each build can be told apart:
          # it shows as the app's version/build and is printed at the top of Paperboat.log.
          PLIST="$APP/Info.plist"
          BASE=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$PLIST")
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ github.run_number }}" "$PLIST"
          REL="$RELEASE_VERSION"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then REL="${GITHUB_REF_NAME#v}"; fi
          if [[ -n "$REL" ]]; then
            # Release builds show the release version (1.0.0).
            /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${REL}" "$PLIST"
          else
            /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${BASE}-b${{ github.run_number }}${IPA_FLAVOR}" "$PLIST"
          fi
          mkdir -p out/Payload
          cp -R "$APP" out/Payload/
          (cd out && zip -qry PaperReality-unsigned.ipa Payload)
          mv out/PaperReality-unsigned.ipa "out/PaperReality-b${{ github.run_number }}${IPA_FLAVOR}-unsigned.ipa"

      - name: Verify packaged iPhone and iPad support
        run: |
          python3 - <<'PYVERIFY'
          import json
          import os
          from pathlib import Path
          import plistlib
          import zipfile

          ipa = next(Path('out').glob('*.ipa'))
          with zipfile.ZipFile(ipa) as archive:
              assert archive.testzip() is None, 'IPA archive failed its CRC check'
              path = next(name for name in archive.namelist()
                          if name.count('/') == 2 and name.endswith('/Info.plist'))
              metadata = plistlib.loads(archive.read(path))
          assert metadata.get('UIDeviceFamily') == [1, 2], 'IPA must support native iPhone and iPad'
          assert metadata.get('MinimumOSVersion') == '16.3', 'Unexpected minimum OS version'
          assert metadata.get('CFBundleDisplayName') == 'PaperReality', 'Unexpected app display name'
          assert metadata.get('CFBundleIdentifier') == 'com.damien.paperreality', 'Unexpected bundle identifier'
          assert metadata.get('CFBundleVersion') == os.environ['GITHUB_RUN_NUMBER'], 'Unexpected build number'
          ref = os.environ.get('GITHUB_REF', '')
          release_version = (ref.removeprefix('refs/tags/v') if ref.startswith('refs/tags/v')
                             else os.environ.get('RELEASE_VERSION', ''))
          if release_version:
              assert metadata.get('CFBundleShortVersionString') == release_version, 'Unexpected release version'
          summary = {key: metadata.get(key) for key in (
              'CFBundleDisplayName', 'CFBundleIdentifier', 'CFBundleShortVersionString',
              'CFBundleVersion', 'UIDeviceFamily', 'MinimumOSVersion')}
          print('::notice::Verified packaged IPA metadata: ' + json.dumps(summary, sort_keys=True))
          PYVERIFY

      - name: Upload IPA
        uses: actions/upload-artifact@v7
        with:
          name: PaperReality-unsigned-ipa-b${{ github.run_number }}${{ env.IPA_FLAVOR }}
          path: out/PaperReality-b${{ github.run_number }}${{ env.IPA_FLAVOR }}-unsigned.ipa


  publish-release:
    name: Publish PaperReality 1.0.6
    needs: ios
    if: github.ref == 'refs/heads/release/v1.0.6'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v8
        with:
          name: PaperReality-unsigned-ipa-b${{ github.run_number }}
          path: release-artifact

      - name: Publish verified release IPA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REL="1.0.6"
          TAG="v$REL"
          CURRENT=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/release/v1.0.6" --jq '.object.sha')
          if [[ "$CURRENT" != "$GITHUB_SHA" ]]; then
            echo "Release branch changed during this build; refusing stale publication."
            exit 1
          fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing to replace it."
            exit 1
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" > tag.json 2>/dev/null; then
            TAG_COMMIT=$(python3 -c 'import json; print(json.load(open("tag.json"))["object"]["sha"])')
            if [[ "$TAG_COMMIT" != "$GITHUB_SHA" ]]; then
              echo "Tag $TAG points at different source; refusing publication."
              exit 1
            fi
          fi
          cp "release-artifact/PaperReality-b$GITHUB_RUN_NUMBER-unsigned.ipa" "release-artifact/PaperReality-$TAG-unsigned.ipa"
          gh release create "$TAG" "release-artifact/PaperReality-$TAG-unsigned.ipa" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "PaperReality $REL" --notes-file "docs/release-notes/$TAG.md" --latest
